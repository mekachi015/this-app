spring.application.name=This_App_Backend

ors.api.key= ${ORS_API_KEY}
server.servlet.session.store-dir=${SESSION_STORE_DIR}

# PostgreSQL Database Configuration
# spring.datasource.url=${DB_URL}
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=${DB_USERNAME}
# spring.datasource.password=${DB_PASSWORD}

spring.datasource.url=jdbc:postgresql://localhost:5432/FootyFocus_D
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=admin


spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.h2.console.settings.web-allow-others=true


# Server Port
# server.port=${SERVER_PORT}
# AFTER (falls back to 8080 if not set):
server.port=${SERVER_PORT:8080}

# CORS Configuration (Crucial for Angular Frontend)
# Allows requests from your Angular development server (http://localhost:4200)
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

#Payfast Configuration
payfast.merchant-id=${PAYFAST_MERCHANT_ID}
payfast.merchant-key=${PAYFAST_MERCHAN_KEY}
payfast.passphrase=${PAYFAST_PASSPHRASE}
payfast.sandbox=${PAYFAST_SANDBOX}

#Urls payfast redirect/posts to
payfast.return.url=${PAYFAST_RETURN_URL}
payfast.cancel.url=${PAYFAST_CANCEL_URL}
payfast.notify.url=${PAYFAST_NOTIFY_URL}

#platform commisions (percantage to be changes later)
platform.commission.percent=${PLATFORM_COMMISSION_PERCENT}
platform.delivery.cut=${PLATFORM_DELIVERY_CUT}
platform.shipping.fee=${PLATFORM_SHIPPING_FEE}
platform.shipping.fee.multistore=${PLATFORM_SHIPPING_FEE_MULTISTORE}
