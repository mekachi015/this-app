# Server Configuration
#SERVER_PORT=8080
server.port=8080
server.servlet.session.store-dir=/tmp

# JWT Configuration for Testing
jwt.secret=test-secret-key-for-testing-purposes-only-not-for-production
jwt.expiration=3600000

# PayFast Configuration for Testing
payfast.merchant-id=test-merchant
payfast.merchant-key=test-key
payfast.passphrase=test-passphrase
payfast.sandbox=true
payfast.return.url=http://localhost:8080/api/payfast/return
payfast.cancel.url=http://localhost:8080/api/payfast/cancel
payfast.notify.url=http://localhost:8080/api/payfast/notify

# Platform Configuration
platform.commission.percent=10
platform.shipping.fee=150.00

# Logging for Tests
logging.level.root=WARN
logging.level.com.example.This_App_Backend=DEBUG
logging.level.org.springframework.security=DEBUG

# DataSource (in-memory H2 for testing)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:4200
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

# Cloudinary (test values)
cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-api-key
cloudinary.api-secret=test-api-secret
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ORS API (test value)
ors.api.key=test-ors-api-key
