<div class="address-page">
  

   <div class="address-list">
    <h2>Your Saved Addresses</h2>
    <div *ngFor="let address of addresses" class="address-item">
      <p>{{ address.streetName }}, {{ address.streetNumber }}</p>
      <p>{{ address.suburb }}</p>
      <p>{{ address.city }}, {{ address.province }} - {{ address.postalCode }}</p>
      <p>Type: {{ address.addressType }}</p>
      <button (click)="editAddress(address)">Edit</button>
      <button (click)="deleteAddress(address.addressId)">Delete</button>
    </div>

  <form [formGroup]="addressForm" (ngSubmit)="onSubmit()">
    <div>
      <label for="addressLine1">Street Number</label>
      <input id="addressLine1" formControlName="streetNumber" type="text" required>
    </div>

    <div>
      <label for="addressLine2">Street Name</label>
      <input id="addressLine2" formControlName="streetName" type="text">
    </div>

    <div>
      <label for="addressLine3">Suburb</label>
      <input id="addressLine3" formControlName="suburb" type="text">
    </div>

    <div>
      <label for="city">City</label>
      <input id="city" formControlName="city" type="text" required>
    </div>

    <div>
      <label for="province">Province</label>
      <input id="province" formControlName="province" type="text" required>
    </div>

    <div>
      <label for="postalCode">Postal Code</label>
      <input id="postalCode" formControlName="postalCode" type="text" required>
    </div>

    <div>
      <label for="addressType">Address Type</label>
      <select id="addressType" formControlName="addressType">
        <option value="SHIPPING">Shipping</option>
        <option value="BILLING">Billing</option>
        <option value="BOTH">Both</option>
      </select>
    </div>

    <div>
      <label>
        <input type="checkbox" formControlName="isDefault">
        Set as default address
      </label>
    </div>

    <button type="submit" [disabled]="addressForm.invalid">{{ editingAddressId !== null ? 'Update Address' : 'Save Address' }}</button>
  </form>

 
  </div>
</div>
