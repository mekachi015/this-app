<!-- profile.component.html - Add these changes -->

<div class="user-info-section">
  <!-- Profile photo with click to change functionality -->
  <div class="profile-photo-container" (click)="onProfilePhotoClick()">
    <img [src]="userPhotoUrl || 'assets/profile-photos/profile-picture.jpg'" alt="Profile Photo">
    <div class="photo-overlay">
      <i class="fas fa-camera"></i>
      <span>Change Photo</span>
    </div>
    <!-- Loading spinner -->
    <div class="photo-loading" *ngIf="isPhotoChanging">
      <i class="fas fa-spinner fa-spin"></i>
    </div>
  </div>
  <span>{{ userName }}</span>
  
  <!-- Hidden file input -->
  <input 
    #fileInput 
    type="file" 
    accept="image/*" 
    (change)="onFileSelected($event)"
    style="display: none;">
</div>

<!-- User summary section with conditional content based on user type -->
<div class="user-summary-section">
  <!-- Customer view -->
  <div *ngIf="userType === UserType.CUSTOMER" (click)="goToWishlist()" style="cursor: pointer;">
    <i class="fas fa-heart"></i>
    <div>Wishlist</div>
  </div>
  
  <!-- Common for all user types -->
  <div *ngIf="userType === UserType.CUSTOMER">
    <i class="fas fa-wallet"></i>
    <div>Wallet</div>
  </div>
  
  <div *ngIf="userType === UserType.CUSTOMER" (click)="goToOrders()">
    <i class="fas fa-box"></i>
    <div >Orders</div>
  </div>

  <!-- Added Address navigation for customers --> 
   <!-- <div *ngIf="userType === UserType.CUSTOMER" (click)="goToAddressPage()" style="cursor: pointer;">
    <i class="fas fa-map-marker-alt"></i>
    <div>Address</div>
  </div> -->

  <!-- Driver specific summary -->
  <div *ngIf="userType === UserType.DRIVER">
    <i class="fas fa-route"></i>
    <div>Active Deliveries</div>
  </div>
  
  <div *ngIf="userType === UserType.DRIVER">
    <i class="fas fa-dollar-sign"></i>
    <div>Today's Earnings</div>
  </div>
  
  <div *ngIf="userType === UserType.DRIVER">
    <i class="fas fa-star"></i>
    <div>Rating</div>
  </div>

  <!-- Admin specific summary -->
  <div *ngIf="userType === UserType.ADMIN">
    <i class="fas fa-users"></i>
    <div>Total Users</div>
  </div>
  
  <div *ngIf="userType === UserType.ADMIN">
    <i class="fas fa-chart-line"></i>
    <div>System Status</div>
  </div>
  
  <div *ngIf="userType === UserType.ADMIN">
    <i class="fas fa-bell"></i>
    <div>Alerts</div>
  </div>
</div>

<!-- Settings section remains the same, but now uses dynamic settings -->
<div class="settings-section">
  <div *ngFor="let setting of settings" 
       (click)="onSettingClick(setting.name)"
       style="display: flex; align-items: flex-start; margin-bottom: 24px; cursor: pointer;">
    <i [class]="setting.icon" style="font-size: 24px; margin-right: 16px;"></i>
    <div>
      <div style="font-weight: bold;">{{ setting.name }}</div>
      <div style="font-size: 12px; color: #888;">{{ setting.description }}</div>
    </div>
  </div>
</div>
